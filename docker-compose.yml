# Pensive API Docker Compose Configuration

services:
  pensive-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - LLM_URI=${LLM_URI}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_KEY=${LLM_KEY}
      - LLM_EMBEDDING_URI=${LLM_EMBEDDING_URI}
      - LLM_EMBEDDING_MODEL=${LLM_EMBEDDING_MODEL}
      - LLM_EMBEDDING_KEY=${LLM_EMBEDDING_KEY}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PENSIVE_AGENT_WORKSPACES=/app/agent-workspaces
      - PENSIVE_PROJECTS_ROOT=/projects
      - GLEAN_MCP_URL=${GLEAN_MCP_URL:-https://mongodb-be.glean.com/mcp/default}
      - GLEAN_SCOPE=${GLEAN_SCOPE:-SEARCH DOCUMENTS ENTITIES MCP}
      - GLEAN_REDIRECT_URI=${GLEAN_REDIRECT_URI:-http://localhost:8000/glean/callback}
      - GLEAN_TOKEN_CACHE=/app/.glean-tokens.json
    volumes:
      # Agent lab workspaces live on the host so built apps survive container
      # recreations (path: ${PENSIVE_AGENT_WORKSPACES:-./agent-workspaces}).
      - ./agent-workspaces:/app/agent-workspaces
      # Host projects dir (including the OKF bundle) — READ-ONLY.
      - ${PROJECTS_HOST_DIR:-${HOME}/projects}:/projects:ro
      # Glean OAuth token cache (one user's local dev credentials).
      - ./.glean-tokens.json:/app/.glean-tokens.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
